    lead-intel/platform:
      name: Lead Intelligence - 12 sections, sample/select/build
      stages: SWARM_SELECT_BUILD
      autoAdvance: true
      mode: economy
      query: |-
        LEAD INTELLIGENCE PLATFORM - 12 UI sections designed in parallel, the user picks the winners one section at a time, the winners build.

        HEADLESS. Do not stop for council approval, plan approval, agent approval, implementation approval, intermediate confirmation, routine code-change confirmation or QA-fix confirmation. The only planned human gate is the SELECT stage, where the user votes on samples. After a selection is recorded, continue automatically. Do not ask "Continue?" or "Approve this phase?".

        PIPELINE ARGUMENTS, for the chat model driving this run: pass submit_to as `billboard` on EVERY pipeline tool call in this run, including every Continue. It is not stored between calls, and a stage that finishes without it leaves the files uncommitted in staging. Never pass restart.

        TARGET REPOSITORY: ~\Documents\claudecode\billboard-platform (writer key `billboard`, branch docs/leadforge-council-prompt). This is a temporary home - the platform will be migrated out later, so keep it self-contained under a single top-level folder and do not entangle it with the existing billboard app's routes, schema or deploy config beyond what is needed to render it.

        READ-ONLY PORT SOURCES, never write into them: the existing billboard lib/ and app/api/ (prior Metro Manila prospecting and Google Maps work), ~\Documents\claudecode\green-energy-platform, ~\Documents\claudecode\deepseek-harness. Reuse the existing Manila scraping logic and methodology where it exists. Do NOT build another standalone Manila application. LEADFORGE-COUNCIL-PROMPT.md at the billboard repository root is the prior scope note for that work; read it.

        SEATS AND ROUTING. The enabled roster is: openai (Codex, paid subscription), deepseek and kimi (paid, metered through the OpenRouter relay - the whole budget is about 3 US dollars, so spend it on judgement, not typing), free-claude (free, via the local proxy - no metered cost and no subscription quota), and the agy-* Antigravity seats. Route every substantive task through the existing weight router rather than hard-coding "all frontend to Codex" or "all design to Claude": judge task type, required capability, coding intensity, reasoning intensity, design intensity, context size, tool requirements, expected output size, latency, seat availability, quota and cost class. FREE-FIRST: before spending a paid seat on a separable implementation or support task, ask whether free-claude can do it reliably; if yes, give it to free-claude. Capability comes before price - do not force free-claude onto work beyond it. free-claude takes: shared UI harness, mock data, fixtures, repetitive components, schemas, data transformations, scraper adapters, HTML extraction, source enumeration, normalization, deduplication, enrichment plumbing, simple parsers, API scaffolding, boilerplate, test generation, regression tests, QA, bug reproduction, build documentation and repetitive fixes.

        SAMPLE STAGE - 12 SECTIONS, ONE SAMPLE PER SEAT PER SECTION, ALL IN PARALLEL.
        The 12 sections: 1 Lead Intelligence Dashboard. 2 Leads Workspace. 3 RFP / Opportunity Workspace. 4 RFP Detail / Analysis. 5 Applications Workspace. 6 Application Builder. 7 Company Answer Library. 8 Document Vault. 9 Scraping Presets. 10 Sources Workspace. 11 DSH Swarm / Run Monitor. 12 Desktop / Browser Application Agent.
        Every participating design seat gets the SAME functional requirements, sample dataset, data model, required fields, workflow requirements, desktop and responsive requirements, light/dark requirements and acceptance criteria. Do not give one designer more functionality than another. A seat must not read a competing sample before finishing its own. One sample per seat per section - never several from one seat.
        Each sample must be a WORKING clickable prototype with representative sample data, working navigation, the required interactions, a desktop layout, responsive behaviour, and light and dark mode where applicable. Static concept art does not count. Write each sample under design/<section-number>-<section-slug>/<seat>/ with a PROVENANCE.md recording section, sample_id, agent, seat, provider, model and artifact path. Never lose the chain from a sample to the seat and model that produced it.

        SELECT STAGE - the user's gate. Present samples one at a time within a section. The user may take a whole sample or individual pieces from different samples - navigation from one, metric cards from another, the table from a third. Record each selection independently in design/SELECTIONS.md as section, element, sample, producing_agent, producing_seat, provider, model, artifact, user_selection. A seat becomes a winning seat when at least one of its pieces is selected, and it becomes the preferred owner of that area. Do not require one sample to win a whole section.

        SWARM STAGE - six production groups, not twelve isolated builds.
        G1 Dashboard + shared navigation, global shell, shared layout, notification and status patterns.
        G2 Leads + RFP listing: search, filtering, sorting, cards and tables, detail entry points.
        G3 RFP detail + applications: requirement extraction views, Applications Workspace, Application Builder, response workflow.
        G4 Answer Library + Document Vault: reusable answers, company facts, attachments, provenance.
        G5 Presets + Sources: scraping presets, source health, crawl configuration, preset management.
        G6 Run Monitor + Desktop Agent: execution status, application progress, browser and portal workflow.
        Start a group as soon as the UI pieces it needs are selected - do not wait for all twelve votes. A winning seat preserves the design intent of the elements it won and owns integration and review for them; it does not have to type every file. Give fixtures, repetitive components, tests and simple glue to free-claude, code-heavy subsystems and complex interaction logic to the router's choice of paid seat.

        PRODUCT ARCHITECTURE - one unified system, not disconnected scrapers: Presets, Universal Lead DB, Source Registry, Discovery/Scraper Engine, Normalization, Deduplication, Enrichment, Qualification, RFP Analyzer, Answer Library, Document Vault, Application Builder, Desktop/Browser Agent, Results/Reporting.
        Engine pipeline: source adapters, discovery, collection, extraction, normalization, deduplication, enrichment, qualification, lead/opportunity database. Adapters: generic web, search, procurement portals, directories, sitemaps, RSS, APIs, PDF/document repositories, browser-based sources, CSV import. Prefer an adapter or a preset over a new standalone scraper.
        Initial presets: Manila Lead Scraper, Institutional RFP, Government Procurement, Universities/Schools, Hospitals/Healthcare, Business Leads, General Web Leads, Custom. Each configures sources, geography, keywords, exclusions, organization types, extraction fields, qualification rules, crawl depth, frequency, document collection, enrichment, scoring and post-qualification actions.
        Universal record: id, preset, type, organization, opportunity, website, source_url, location, contact_name, contact_email, contact_phone, description, category, keywords, solicitation_number, posted_date, deadline, estimated_value, documents, portal, login_required, qualification_score, qualification_reasons, status, assigned_agent, source_agent, dsh_run, last_checked. RFP fields extend this record rather than forking it.
        RFP pipeline: discovered, documents collected, requirements extracted, eligibility analyzed, qualification scored, Answer Library matched, response generated, documents assembled, application prepared, desktop/browser agent.
        Answer Library covers legal and company information, capabilities, standard responses, certifications, registrations, insurance, references, case studies, past performance, security, privacy, SLAs, accessibility, implementation, support, sustainability and recurring procurement answers. Every answer keeps its provenance. NEVER invent a company qualification, certification, registration or past performance record - leave it unanswered and flag it.
        Document Vault holds W-9, insurance certificates, capabilities statements, certifications, licences, references, resumes, case studies, financial documents and standard attachments.
        Desktop/Browser Application Agent has three modes: Assisted (fills what it can, surfaces the rest), Review (prepares everything and stops before final submission) and Authorized Auto (may submit only where the configured workflow policy explicitly authorizes it). It exposes portal, opportunity, answers entered, uploaded documents, unresolved questions, validation errors, progress, submission state and evidence.

        FAILURE HANDLING: record the failure, retry when appropriate, let the router pick another eligible seat, resume. One failed worker does not stop the swarm. Never silently change a UI decision the user made.
        QA: give free-claude broad automated tests, parser tests, scraper tests, regression tests, fixture validation, responsive checks, duplicate-detection tests, workflow tests and bug reproduction. Route hard defects to the router's choice of paid seat. Run repairs without asking again.
        PARALLELISM: run independent units simultaneously across every enabled seat. Avoid serialization that buys nothing.

        HOST-COMMIT RULES. The host refuses the WHOLE commit if any unit writes one of these, so no unit may write package.json, pnpm-lock.yaml, pnpm-workspace.yaml, package-lock.json, .npmrc, any .env or .env.* file, anything under .github/workflows/, .husky/ or .githooks/, CLAUDE.md, AGENTS.md, settings.yaml, jsconfig.json, prisma/schema.prisma, or any *.pem / *.key file; and no unit may put secret-shaped text in any file, even as an example - use placeholders. Instead: document environment variables in config/env.example, list npm dependencies in DEPENDENCIES.md at the repository root as one table row per package (name, version range, dependency or devDependency, why), and describe any schema change in PRISMA-CHANGES.md rather than editing the schema. Exactly one unit owns each file - two units writing one path sinks the submission. Every path is relative to the repository root.

        Every seat names its own model (GPT-6, DeepSeek V4, Kimi K2, Claude Opus 5, Gemini 3.8 and so on) in anything the user reads. A seat label may accompany the model name, never replace it.
